[project]
name = "coursehub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "python-slugify>=9.1.3",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # Basic Python style and syntax errors.
    "F",              # Undefined names and unused imports/variables.
    "I",              # Import sorting.
    "UP",             # Modern Python syntax.
    "B",              # Common bugs (flake8-bugbear).
    "SIM",            # Simple code simplifications.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
