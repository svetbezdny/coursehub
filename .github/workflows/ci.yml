name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      COURSEHUB_SECRET_KEY: ci-only-key-for-coursehub-tests-not-for-deploy
      COURSEHUB_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      UV_LOCKED: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: "3.13"

      - run: uv sync --directory backend --locked
      - run: make lint-back
      - run: make test-back

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend
      - run: make lint-front
      - run: make build-front